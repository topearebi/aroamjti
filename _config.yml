# --- Site settings ---
title: A Record Of A Mortal's Journey To Immortality
description: Documenting my days, that I may learn from them someday.
author: Temitope Arebi

# Set these to match your custom subdomain.
# If serving from blog.example.com at the root, baseurl is empty.
url: "https://aroamjti.topearebi.com"
baseurl: ""

# --- Social links (footer icons) ---
# Fill in your real URLs. Delete any line you don't want shown.
# Order here is the order they appear. RSS is generated by the site.
social:
  - name: Instagram
    url: "https://instagram.com/YOUR_HANDLE"
  - name: Threads
    url: "https://threads.net/@YOUR_HANDLE"
  - name: Bluesky
    url: "https://bsky.app/profile/YOUR_HANDLE"
  - name: LinkedIn
    url: "https://linkedin.com/in/YOUR_HANDLE"
  - name: Tumblr
    url: "https://YOUR_HANDLE.tumblr.com"
  - name: Discord
    url: "https://discord.gg/YOUR_INVITE"
  - name: Email
    url: "mailto:you@example.com"
  - name: RSS
    url: "/feed.xml"

# --- Build settings ---
markdown: kramdown
permalink: /:year/:month/:day/:title/

# --- Pagination (jekyll-paginate) ---
# Paginates the home page (index.html) only. Change `paginate` to adjust
# how many posts appear per page. `paginate_path` controls the URL of pages
# 2, 3, 4 ... (page 1 stays at "/").
paginate: 25
paginate_path: "/page:num/"

# --- Plugins (all GitHub Pages-supported) ---
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

# --- Feed (jekyll-feed) ---
# Generates /feed.xml automatically. No feed.xml file needed in the repo.

# --- Navigation ---
# Edit this list to change the nav bar. Order is preserved.
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Books
    url: /books/
  - title: Blogroll
    url: /blogroll/

# --- Exclude from build output ---
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - bear_to_jekyll.py
