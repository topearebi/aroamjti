# --- Site settings ---
title: A Record Of A Mortal's Journey To Immortality
description: Documenting my days, that I may learn from them someday.
# Author as a map so jekyll-feed can emit a complete Atom <author> element
# (name + uri + email). Referenced elsewhere as site.author.name.
author:
  name: Temitope Arebi
  email: hi@topearebi.com
  uri: https://aroamjti.topearebi.com

# Set these to match your custom subdomain.
# If serving from blog.example.com at the root, baseurl is empty.
url: "https://aroamjti.topearebi.com"
baseurl: ""

# --- Social links (footer icons) ---
# Fill in your real URLs. Delete any line you don't want shown.
# Order here is the order they appear. RSS is generated by the site.
social:
  - name: Instagram
    url: "https://instagram.com/topearebi"
  - name: Threads
    url: "https://threads.net/@topearebi"
  - name: Bluesky
    url: "https://bsky.app/profile/social.topearebi.com"
  - name: LinkedIn
    url: "https://linkedin.com/in/topearebi"
  - name: Tumblr
    url: "https://lostrous.tumblr.com"
  # - name: Discord
  #   url: "https://discord.gg/YOUR_INVITE"
  - name: Email
    url: "mailto:hi@topearebi.com"
  - name: RSS
    url: "/feed.xml"

# --- Build settings ---
markdown: kramdown
permalink: /:year/:month/:day/:title/

# --- Collections ---
# "Works" are longer standalone compositions, kept out of the post feed.
# Each lives in _works/ as its own file and appears on the /works/ index.
collections:
  works:
    output: true
    permalink: /works/:name/

# --- Pagination (jekyll-paginate) ---
# Paginates the home page (index.html) only. Change `paginate` to adjust
# how many posts appear per page. `paginate_path` controls the URL of pages
# 2, 3, 4 ... (page 1 stays at "/").
paginate: 25
paginate_path: "/page:num/"

# --- Plugins (all GitHub Pages-supported) ---
plugins:
  - jekyll-paginate
  - jekyll-feed

# --- Feed (jekyll-feed) ---
# Generates /feed.xml automatically. No feed.xml file needed in the repo.

# --- Navigation ---
# Edit this list to change the nav bar. Order is preserved.
nav:
  - title: Home
    url: /
  - title: Browse
    url: /browse/
  - title: About
    url: /about/
  - title: Books
    url: /books/
  - title: Works
    url: /works/
  - title: Blogroll
    url: /blogroll/

# --- Exclude from build output ---
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - bear_to_jekyll.py
  # Never let Jekyll scan installed gems / CI bundle dirs as site content.
  # Without these, `jekyll build` in CI tries to render Jekyll's own gem
  # templates (e.g. the sample _posts file) and fails on their placeholder
  # front matter — especially under --strict_front_matter.
  - vendor/
  - .bundle/
  - .github/
