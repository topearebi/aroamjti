# Canonical tag descriptors. One line each, shown beside the tag on /tags/.
# Editing this is a deliberate taxonomy act. Tags not listed here still work;
# they just render without a descriptor and group under "Unsorted" on the tag
# page (useful for spotting un-migrated old tags).
#
# Order here does not matter — the page sorts alphabetically.
#
# Two axes, never mixed: `type:` is the FORM of a piece, `tags:` is the SUBJECT.
# Strict maximum of 2 tags per post — force the dominant emotional weather.
# `satire` is the sole intentional mode-tag; no future tag may name a technique.

love:            affection, attachment, longing — the beginning and middle love
desire:          physical intimacy, passion, intense wanting
heartbreak:      endings, loss of love, the grief of a relationship's close
struggle:        the dark thread — depression, fear, feeling lost, the fight to heal
malice:          human darkness as subject — envy, betrayal, cruelty, cold self-interest
mortality:       death, time passing, human limits
existential:     cosmic indifference, duality, meaning, the human place in an uncaring world
haunting:        the surreal and dreadful — demons, voids, shadows, unreality
neurodivergence: autism, time-blindness, the texture of a differently wired mind
philosophy:      human nature, society, rules, the examined life
faith:           religion, belief, doubt, the sacred
growth:          discipline, consistency, progress, moving forward
life:            everyday lived experience — food, places, the body, daily texture
craft:           the making of art — the muse, creative block, the writer and the word
satire:          the comic and critical
